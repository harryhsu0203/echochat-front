<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="login.title">EchoChat - 登入 | AI 客服系統管理後台</title>
    <meta name="description" content="登入 EchoChat AI 客服系統管理後台，管理您的 LINE 聊天機器人、智慧客服設定、知識庫和對話記錄。">
    <meta name="keywords" content="EchoChat 登入, AI 客服登入, 客服系統登入, LINE Bot 管理, 智慧客服後台, 客服管理系統">
    <meta name="robots" content="noindex,nofollow">
    <link rel="canonical" href="https://echochat-web.onrender.com/login.html">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <meta name="theme-color" content="#667eea">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="navbar.css" rel="stylesheet">
    <script src="js/api-config.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }


        
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
        }
        
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .login-header h2 {
            margin: 0;
            font-weight: 600;
        }
        
        .login-header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
        }
        
        .login-body {
            padding: 40px 30px;
        }
        
        .form-floating {
            margin-bottom: 20px;
        }
        
        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 15px;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .input-group-text {
            background: transparent;
            border: 2px solid #e9ecef;
            border-right: none;
            border-radius: 10px 0 0 10px;
        }
        
        .input-group .form-control {
            border-left: none;
            border-radius: 0 10px 10px 0;
        }
        
        .input-group:focus-within .input-group-text {
            border-color: #667eea;
        }
        
        .input-group:focus-within .btn-outline-secondary {
            border-color: #667eea;
        }
        
        .btn-outline-secondary {
            border-color: #e9ecef;
            color: #6c757d;
            transition: all 0.3s;
        }
        
        .btn-outline-secondary:hover {
            background-color: #f8f9fa;
            border-color: #667eea;
            color: #667eea;
        }
        
        .form-check-input:checked {
            background-color: #667eea;
            border-color: #667eea;
        }
        
        .form-check-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .form-check-label {
            color: #6c757d;
            font-size: 14px;
        }
        
        .alert {
            border-radius: 10px;
            border: none;
            margin-bottom: 20px;
        }

        /* 登入成功轉跳狀態卡片（保留原流程，僅優化視覺） */
        .login-success-state {
            margin-bottom: 20px;
            border-radius: 14px;
            border: 1px solid #e6f4ea;
            background: linear-gradient(180deg, #f8fffb 0%, #f2fbf6 100%);
            padding: 16px;
            box-shadow: 0 8px 24px rgba(34, 139, 87, 0.08);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .login-success-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #22a06b;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .login-success-title {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: #1f2d3d;
            line-height: 1.2;
        }

        .login-success-subtitle {
            margin: 2px 0 0 0;
            font-size: 0.9rem;
            color: #4d5b6a;
        }

        .login-success-loader {
            margin-left: auto;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            flex-shrink: 0;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .footer-links {
            text-align: center;
            margin-top: 20px;
        }
        
        .footer-links a {
            color: #667eea;
            text-decoration: none;
            margin: 0 10px;
            transition: color 0.3s;
        }
        
        .footer-links a:hover {
            color: #764ba2;
        }
        
        .back-to-home-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            cursor: pointer;
            z-index: 1000;
            text-decoration: none;
        }
        
        .back-to-home-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
            color: white;
        }
        
        .back-to-home-btn:active {
            transform: translateY(0);
        }
    </style>
    <script src="js/i18n.js"></script>
</head>
<body>


    <a href="index.html" class="back-to-home-btn" title="回首頁">
        <i class="fas fa-home"></i>
    </a>
    
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-robot fa-3x mb-3"></i>
                <h2 data-i18n="login.brand">EchoChat</h2>
                <p data-i18n="login.subtitle">智能聊天機器人管理系統</p>
            </div>
            
            <div class="login-body">
                <div id="alertContainer"></div>

                <!-- ── OAuth 登入按鈕區 ─────────────────────── -->
                <!-- Google Identity Services（One Tap + button，popup 模式） -->
                <div id="g_id_onload"
                     data-client_id=""
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="onGoogleSignIn"
                     data-auto_select="false"
                     data-itp_support="true"></div>

                <div id="oauthButtons" style="display:none;">
                    <!-- Google 登入按鈕（GSI 官方樣式） -->
                    <div id="googleBtnWrapper" style="display:none;margin-bottom:10px;">
                        <div class="g_id_signin"
                             data-type="standard"
                             data-size="large"
                             data-theme="outline"
                             data-text="signin_with"
                             data-shape="rectangular"
                             data-logo_alignment="left"
                             data-width="340"></div>
                        <!-- 若 GSI button 未渲染，用此 fallback -->
                        <button type="button" id="googleFallbackBtn" onclick="startGoogleOAuth()"
                            style="display:none;width:100%;padding:10px;border:1px solid #dadce0;border-radius:6px;background:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;">
                            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                            使用 Google 登入
                        </button>
                    </div>

                    <!-- LINE 登入按鈕 -->
                    <div id="lineBtnWrapper" style="display:none;margin-bottom:10px;">
                        <button type="button" onclick="startLineLogin()"
                            style="width:100%;padding:10px 14px;border:none;border-radius:6px;background:#06C755;color:#fff;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M19.365 9.89c.50 0 .91.41.91.91s-.41.91-.91.91H17.3v1.09h2.07c.50 0 .91.41.91.91s-.41.91-.91.91H16.39a.91.91 0 0 1-.91-.91V9.89c0-.50.41-.91.91-.91h2.97zm-6.5 0c.50 0 .91.41.91.91v3.82a.91.91 0 0 1-.91.91h-.01a.91.91 0 0 1-.91-.91V9.89c0-.50.41-.91.91-.91h.01zm-2.83 0c.50 0 .91.41.91.91v2.44l-1.72-2.99a.91.91 0 0 0-.79-.46h-.01a.91.91 0 0 0-.91.91v3.82c0 .50.41.91.91.91s.91-.41.91-.91v-2.44l1.72 2.99c.17.29.48.46.79.46h.01c.50 0 .91-.41.91-.91V9.89c0-.50-.41-.91-.91-.91h-.01zM4.635 9.89c.50 0 .91.41.91.91s-.41.91-.91.91H3.27v1.09h1.37c.50 0 .91.41.91.91s-.41.91-.91.91H3.27a.91.91 0 0 1-.91-.91V9.89c0-.50.41-.91.91-.91h1.37zM12 0C5.37 0 0 4.89 0 10.91c0 5.39 4.78 9.91 11.21 10.78.44.09 1.03.29 1.18.66.14.34.09.86.04 1.21l-.18 1.09c-.06.33-.26 1.29 1.13.7 1.39-.59 7.51-4.43 10.24-7.58C24.93 15.21 24 13.15 24 10.91 24 4.89 18.63 0 12 0z"/></svg>
                            使用 LINE 登入
                        </button>
                    </div>

                    <!-- 分隔線 -->
                    <div style="display:flex;align-items:center;margin:14px 0;color:#aaa;font-size:13px;gap:10px;">
                        <div style="flex:1;height:1px;background:#e0e0e0;"></div>
                        <span>或使用帳號密碼登入</span>
                        <div style="flex:1;height:1px;background:#e0e0e0;"></div>
                    </div>
                </div>
                <!-- ─────────────────────────────────────────── -->

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="input-group mb-3">
                        <span class="input-group-text">
                            <i class="fas fa-user"></i>
                        </span>
                        <input type="text" class="form-control" id="username" placeholder="使用者名稱" data-i18n-placeholder="login.form.username" required>
                    </div>
                    
                    <div class="input-group mb-3">
                        <span class="input-group-text">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" class="form-control" id="password" placeholder="密碼" data-i18n-placeholder="login.form.password" required>
                        <button type="button" class="btn btn-outline-secondary" id="togglePassword" style="border-left: none;">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                    
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="rememberUsername">
                        <label class="form-check-label" for="rememberUsername" data-i18n="login.form.remember">
                            記住帳號
                        </label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-login" id="loginBtn" data-i18n="login.btn.login">
                        <i class="fas fa-sign-in-alt me-2"></i>登入
                    </button>
                </form>
                

                
                <div class="footer-links">
                    <a href="#" id="forgotPasswordBtn" data-i18n="login.form.forgot">忘記密碼？</a>
                    <a href="register.html" id="showRegisterBtn" data-i18n="login.register.link">註冊新帳號</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ── OAuth 相關工具 ──────────────────────────────────────
        const API_BASE = (window.API_BASE_URL || 'https://echochat-api.onrender.com/api').replace(/\/api\/?$/, '');
        const API = `${API_BASE}/api`;

        function afterLogin(token, provider) {
            if (!token) return;
            localStorage.setItem('token', token);
            localStorage.setItem('authToken', token);
            showSuccessRedirectState(provider);
        }

        // ── 處理 URL query params（OAuth callback 或錯誤）──────
        (function handleOAuthCallback() {
            const params = new URLSearchParams(window.location.search);
            const oauth = params.get('oauth');
            const provider = params.get('provider') || 'OAuth';
            const token = params.get('token');
            const reason = params.get('reason');

            if (oauth === 'success' && token) {
                history.replaceState({}, '', window.location.pathname); // 清 URL 參數
                afterLogin(token, provider);
                return;
            }
            if (oauth === 'fail') {
                history.replaceState({}, '', window.location.pathname);
                const msg = {
                    invalid_state: '登入驗證失敗（state 不符），請重試',
                    token_exchange_failed: '第三方登入失敗，請稍後再試',
                    missing_code: '登入流程被中斷，請重試'
                }[reason] || `${provider} 登入失敗（${reason || '未知原因'}）`;
                showAlert(msg, 'danger');
            }
        })();

        // ── Google One Tap / Button callback（popup 模式）──────
        async function onGoogleSignIn(resp) {
            try {
                const id_token = resp.credential;
                showAlert('Google 登入中...', 'info');
                const r = await fetch(`${API}/auth/google`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_token })
                });
                const data = await r.json();
                if (r.ok && data.success && data.token) {
                    afterLogin(data.token, 'Google');
                } else {
                    showAlert(data.error || 'Google 登入失敗', 'danger');
                }
            } catch (e) {
                showAlert('Google 登入失敗：' + e.message, 'danger');
            }
        }

        // ── Google OAuth redirect flow（fallback）─────────────
        function startGoogleOAuth() {
            window.location.href = `${API}/auth/google/start`;
        }

        // ── LINE Login redirect ────────────────────────────────
        function startLineLogin() {
            window.location.href = `${API}/auth/line/start`;
        }

        // ── 動態初始化 OAuth 按鈕 ────────────────────────────
        (async () => {
            let googleEnabled = false;
            let lineEnabled = false;

            try {
                const gr = await fetch(`${API}/auth/google/client-id`).then(r => r.json()).catch(() => null);
                if (gr && gr.client_id) {
                    document.getElementById('g_id_onload').setAttribute('data-client_id', gr.client_id);
                    googleEnabled = true;
                    // 若 GSI button 5 秒後沒有渲染，顯示 fallback 按鈕
                    setTimeout(() => {
                        const gsiBtn = document.querySelector('.g_id_signin iframe');
                        if (!gsiBtn) document.getElementById('googleFallbackBtn').style.display = 'flex';
                    }, 5000);
                }
            } catch {}

            try {
                const lr = await fetch(`${API}/auth/line/status`).then(r => r.json()).catch(() => null);
                if (lr && lr.enabled) lineEnabled = true;
            } catch {}

            // 有任何一個 OAuth 啟用就顯示整個區塊
            if (googleEnabled || lineEnabled) {
                document.getElementById('oauthButtons').style.display = 'block';
                if (googleEnabled) document.getElementById('googleBtnWrapper').style.display = 'block';
                if (lineEnabled)   document.getElementById('lineBtnWrapper').style.display = 'block';
            }
        })();
        // 頁面載入時檢查是否有記住的帳號
        document.addEventListener('DOMContentLoaded', function() {
            const rememberedUsername = localStorage.getItem('rememberedUsername');
            if (rememberedUsername) {
                document.getElementById('username').value = rememberedUsername;
                document.getElementById('rememberUsername').checked = true;
            }

            try {
                const logoutReason = sessionStorage.getItem('logoutReason');
                if (logoutReason === 'timeout') {
                    showAlert('您已超過 15 分鐘未操作，請重新登入。', 'warning');
                    // 立即清除，避免重新整理時再次顯示
                    sessionStorage.removeItem('logoutReason');
                    sessionStorage.removeItem('__sessionLogoutTriggered');
                }
            } catch (error) {
                console.warn('無法讀取 sessionStorage:', error);
            }
        });

        // 顯示/隱藏密碼功能
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        });

        // 記住帳號功能
        document.getElementById('rememberUsername').addEventListener('change', function() {
            const username = document.getElementById('username').value;
            if (this.checked) {
                localStorage.setItem('rememberedUsername', username);
            } else {
                localStorage.removeItem('rememberedUsername');
            }
        });

        // 當用戶名輸入框失去焦點時，如果勾選了記住帳號，則保存
        document.getElementById('username').addEventListener('blur', function() {
            const rememberCheckbox = document.getElementById('rememberUsername');
            if (rememberCheckbox.checked) {
                localStorage.setItem('rememberedUsername', this.value);
            }
        });

        
        document.getElementById('forgotPasswordBtn').onclick = function(e) {
            e.preventDefault();
            showForgotPassword();
        };

        document.getElementById('loginForm').onsubmit = handleLogin;
        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            
            console.log('開始登入流程...');
            console.log('🔍 當前 API URL:', API_BASE_URL);
            
            // 先測試API連接
            try {
                const isConnected = await apiClient.testConnection();
                if (!isConnected) {
                    showAlert('無法連接到伺服器，請檢查網路連接或稍後再試', 'danger');
                    return;
                }
            } catch (error) {
                console.error('API 連接測試失敗:', error);
                showAlert('伺服器連接失敗，請稍後再試', 'danger');
                return;
            }
            
            loginBtn.innerHTML = '<span class="loading"></span> 登入中...';
            loginBtn.disabled = true;
            
            try {
                const response = await apiClient.post('/login', { username, password });
                
                console.log('收到回應，狀態:', response.status);
                
                                if (response.ok) {
                    const data = await response.json();
                    // 登入成功，不在 console 輸出敏感資訊
                    
                    // 完整設置用戶資訊
                    apiClient.setToken(data.token);
                    localStorage.setItem('staffName', data.user.name);
                    localStorage.setItem('staffRole', data.user.role);
                    localStorage.setItem('staffUsername', data.user.username);
                    localStorage.setItem('staffId', data.user.id.toString());
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('loginTime', new Date().toISOString());
                    localStorage.setItem('lastActiveAt', Date.now().toString());
                    
                    // 清除登出原因，避免重新整理時再次顯示
                    try {
                        sessionStorage.removeItem('logoutReason');
                        sessionStorage.removeItem('__sessionLogoutTriggered');
                    } catch (e) {
                        console.warn('無法清除 sessionStorage:', e);
                    }
                    
                    // 清除記憶體中的密碼變數，避免被誤用
                    try { window.password = undefined; } catch(e) {}
                    try { document.getElementById('password').value = ''; } catch(e) {}
                    
                    console.log('🔄 延遲 2 秒後跳轉到儀表板...');
                    
                    // showSuccessRedirectState 會處理延遲跳轉與 ?next= 參數
                    showSuccessRedirectState();
                } else {
                    const errorData = await response.json();
                    
                    let errorMessage = '登入失敗';
                    if (errorData.error) {
                        errorMessage = errorData.error;
                    } else if (response.status === 401) {
                        errorMessage = '用戶名或密碼錯誤';
                    } else if (response.status === 500) {
                        errorMessage = '伺服器錯誤，請稍後再試';
                    }
                    
                    showAlert(errorMessage, 'danger');
                }
            } catch (e) {
                console.error('登入錯誤:', e);
                showAlert('網路錯誤，請檢查您的網路連接', 'danger');
            } finally {
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>登入';
                loginBtn.disabled = false;
            }
        }
        function showAlert(msg, type) {
            document.getElementById('alertContainer').innerHTML = `<div class='alert alert-${type}'>${msg}</div>`;
        }

        function showSuccessRedirectState(provider) {
            const providerLabel = provider ? ` (${provider})` : '';
            document.getElementById('alertContainer').innerHTML = `
                <div class="login-success-state" role="status" aria-live="polite">
                    <div class="login-success-icon">
                        <i class="fas fa-check"></i>
                    </div>
                    <div>
                        <p class="login-success-title">登入成功${providerLabel}</p>
                        <p class="login-success-subtitle">正在為你載入工作台，請稍候...</p>
                    </div>
                    <div class="login-success-loader"></div>
                </div>
            `;

            // 判斷跳轉目標
            const params = new URLSearchParams(window.location.search);
            const next = params.get('next');
            let redirectUrl = 'dashboard.html';
            if (next === 'subscribe') {
                redirectUrl = 'dashboard.html?tab=plans&action=subscribe';
            }
            setTimeout(() => { window.location.href = redirectUrl; }, 1200);
        }
        function showForgotPassword() { 
            window.location.href = 'forgot-password.html'; 
        }

    </script>
</body>
</html>
